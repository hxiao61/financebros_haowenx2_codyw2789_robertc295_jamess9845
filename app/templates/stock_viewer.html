<!DOCTYPE html>
<html lang="en">
<head>
  <title>Stock Viewer — Blossomberg</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            mono: ['"IBM Plex Mono"', 'monospace'],
            sans: ['"IBM Plex Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    body { background-color: #060d1b; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-up { animation: fadeUp 0.35s ease both; }
  </style>
</head>

<body class="min-h-screen font-sans text-slate-200">

  {% include "navbar.html" %}

  <main class="max-w-7xl mx-auto px-6 py-10">

    <div class="fade-up flex items-end justify-between border-b border-slate-800 pb-6 mb-8">
      <div>
        <p class="font-mono text-xs uppercase tracking-widest text-sky-500 mb-1">// stock viewer</p>
        <h1 class="font-mono text-2xl font-semibold text-slate-100 tracking-wide">Top 15 Stocks</h1>
      </div>
      <div class="text-right">
        <p id="clock" class="font-mono text-lg text-slate-300"></p>
        <p class="font-mono text-xs text-slate-600 uppercase tracking-widest mt-1">
          Updated: <span id="last-updated">—</span>
        </p>
      </div>
    </div>

    <div class="fade-up bg-slate-900 border border-slate-800 rounded-sm overflow-hidden">
      <table class="w-full">
        <thead>
          <tr class="border-b border-slate-800">
            <th class="font-mono text-xs uppercase tracking-widest text-slate-500 text-left px-5 py-3">Ticker</th>
            <th class="font-mono text-xs uppercase tracking-widest text-slate-500 text-right px-5 py-3">Price</th>
            <th class="font-mono text-xs uppercase tracking-widest text-slate-500 text-right px-5 py-3">Change</th>
            <th class="font-mono text-xs uppercase tracking-widest text-slate-500 text-right px-5 py-3">Open</th>
            <th class="font-mono text-xs uppercase tracking-widest text-slate-500 text-right px-5 py-3">High</th>
            <th class="font-mono text-xs uppercase tracking-widest text-slate-500 text-right px-5 py-3">Low</th>
            <th class="font-mono text-xs uppercase tracking-widest text-slate-500 text-right px-5 py-3">Volume</th>
            <th class="font-mono text-xs uppercase tracking-widest text-slate-500 text-center px-5 py-3">30d</th>
            <th class="font-mono text-xs uppercase tracking-widest text-slate-500 text-right px-5 py-3 whitespace-nowrap">View</th>
          </tr>
        </thead>
        <tbody id="stockviewer-body">
          <tr>
            <td colspan="9" class="font-mono text-xs text-slate-700 text-center py-10 tracking-widest uppercase">
              Loading…
            </td>
          </tr>
        </tbody>
      </table>
    </div>

  </main>

<script src="{{ url_for('static', filename='js/stockviewer.js') }}"></script>
</body>
</html>

<nav class="border-b border-slate-800" style="background-color: #060d1b;">
  <div class="max-w-6xl mx-auto px-6 py-3 flex flex-wrap items-center justify-between gap-3">

    <a href="{{ url_for('dashboard') }}" class="font-mono text-sm font-semibold text-sky-400 tracking-widest uppercase hover:text-sky-300 transition-colors">
      // Blossomberg
    </a>

    <div class="flex flex-wrap items-center gap-6 text-sm">
      <a href="{{ url_for('dashboard') }}"
         class="font-mono text-xs uppercase tracking-widest transition-colors
                {% if active == 'dashboard' %}text-sky-400{% else %}text-slate-500 hover:text-slate-300{% endif %}">
        Dashboard
      </a>
      <a href="{{ url_for('forecast') }}"
         class="font-mono text-xs uppercase tracking-widest transition-colors
                {% if active == 'forecast' %}text-sky-400{% else %}text-slate-500 hover:text-slate-300{% endif %}">
        Forecast
      </a>
      <a href="{{ url_for('aianalysis') }}"
         class="font-mono text-xs uppercase tracking-widest transition-colors
                {% if active == 'aianalysis' %}text-sky-400{% else %}text-slate-500 hover:text-slate-300{% endif %}">
        AI Analysis
      </a>
      <a href="{{ url_for('stockviewer') }}"
         class="font-mono text-xs uppercase tracking-widest transition-colors
                {% if active == 'stockviewer' %}text-sky-400{% else %}text-slate-500 hover:text-slate-300{% endif %}">
        Stocks
      </a>
      <a href="{{ url_for('paper_trading') }}"
         class="font-mono text-xs uppercase tracking-widest transition-colors
                {% if active == 'paper' %}text-sky-400{% else %}text-slate-500 hover:text-slate-300{% endif %}">
        Paper Trade
      </a>

      <div class="flex items-center gap-2">
        <input id="navbar-search" type="text" placeholder="Search ticker…"
               class="bg-slate-900 border border-slate-700 focus:border-sky-600 rounded-sm font-mono text-xs text-slate-200 px-3 py-1.5 w-36 uppercase tracking-widest outline-none transition-colors placeholder:normal-case placeholder:tracking-normal placeholder:text-slate-600">
        <button onclick="searchStock()"
                class="font-mono text-xs uppercase tracking-widest text-slate-500 hover:text-sky-400 transition-colors px-2 py-1.5">
          Go
        </button>
        <span id="search-result" class="font-mono text-xs text-slate-400"></span>
      </div>

      <span class="font-mono text-xs text-slate-600 uppercase tracking-widest">{{ user }}</span>

      <a href="{{ url_for('logout') }}"
         class="font-mono text-xs uppercase tracking-widest text-slate-600 hover:text-red-400 transition-colors">
        Logout
      </a>
    </div>
  </div>
</nav>
<script>
  function searchStock() {
    const val = document.getElementById("navbar-search").value.trim().toUpperCase();
    if (val) window.location.href = "/stock/" + val;
  }
  document.addEventListener("DOMContentLoaded", function () {
    document.getElementById("navbar-search").addEventListener("keydown", function (e) {
      if (e.key === "Enter") searchStock();
    });
  });
</script>

<!DOCTYPE html>
<html lang="en">
<head>
  <title>{{ ticker }} — Blossomberg</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">
  {% include "navbar.html" %}

  <div class="max-w-5xl mx-auto px-4 py-8">

    <div class="flex items-center gap-4 mb-6">
      <a href="/stockviewer" class="text-sm text-gray-500 hover:text-gray-700">← Back</a>
      <h1 class="text-2xl font-bold text-gray-800">{{ ticker }}</h1>
      <span id="badge-change" class="text-sm font-medium px-2 py-1 rounded"></span>
    </div>

    <div class="grid grid-cols-2 sm:grid-cols-6 gap-4 mb-6">
      <div class="bg-white rounded shadow p-4">
        <p class="text-xs text-gray-500 mb-1">Price</p>
        <p id="stat-price" class="text-xl font-bold text-gray-800">—</p>
      </div>
      <div class="bg-white rounded shadow p-4">
        <p class="text-xs text-gray-500 mb-1">Change</p>
        <p id="stat-change" class="text-xl font-bold">—</p>
      </div>
      <div class="bg-white rounded shadow p-4">
        <p class="text-xs text-gray-500 mb-1">Open</p>
        <p id="stat-open" class="text-xl font-bold text-gray-800">—</p>
      </div>
      <div class="bg-white rounded shadow p-4">
        <p class="text-xs text-gray-500 mb-1">Volume</p>
        <p id="stat-vol" class="text-xl font-bold text-gray-800">—</p>
      </div>
      <div class="bg-white rounded shadow p-4">
        <p class="text-xs text-gray-500 mb-1">Day High</p>
        <p id="stat-high" class="text-xl font-bold text-gray-800">—</p>
      </div>
      <div class="bg-white rounded shadow p-4">
        <p class="text-xs text-gray-500 mb-1">Day Low</p>
        <p id="stat-low" class="text-xl font-bold text-gray-800">—</p>
      </div>
    </div>

    <!-- 2x2 Grid of Charts -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="bg-white rounded shadow p-4">
        <h3 class="text-sm font-semibold text-gray-700 mb-2">Price History (1Y)</h3>
        <div class="h-64"><canvas id="priceChart"></canvas></div>
      </div>
      <div class="bg-white rounded shadow p-4">
        <h3 class="text-sm font-semibold text-gray-700 mb-2">Indexed Growth Comparison</h3>
        <div class="h-64"><canvas id="growthChart"></canvas></div>
      </div>
      <div class="bg-white rounded shadow p-4">
        <h3 class="text-sm font-semibold text-gray-700 mb-2">Monthly Trading Volume</h3>
        <div class="h-64"><canvas id="volumeChart"></canvas></div>
      </div>
      <div class="bg-white rounded shadow p-4">
        <h3 class="text-sm font-semibold text-gray-700 mb-2">Sharpe Ratio Comparison (2Y)</h3>
        <div class="h-64"><canvas id="sharpeChart"></canvas></div>
      </div>
    </div>

  </div>

  <script>
    const TICKER = "{{ ticker }}";

    async function loadQuote() {
      const res = await fetch(`/api/stocks/price?ticker=${TICKER}`);
      const d = await res.json();
      if (d.price == null) return;

      document.getElementById("stat-price").textContent = `$${d.price.toFixed(2)}`;
      document.getElementById("stat-open").textContent  = d.open   != null ? `$${d.open.toFixed(2)}`  : "N/A";
      document.getElementById("stat-high").textContent  = d.high   != null ? `$${d.high.toFixed(2)}`  : "N/A";
      document.getElementById("stat-low").textContent   = d.low    != null ? `$${d.low.toFixed(2)}`   : "N/A";
      document.getElementById("stat-vol").textContent   = d.volume != null ? d.volume.toLocaleString() : "N/A";

      if (d.change_pct != null) {
        const up = d.change_pct >= 0;
        const el = document.getElementById("stat-change");
        el.textContent = `${up ? "▲" : "▼"} ${Math.abs(d.change_pct).toFixed(2)}%`;
        el.className = `text-xl font-bold ${up ? "text-green-600" : "text-red-600"}`;
        const badge = document.getElementById("badge-change");
        badge.textContent = el.textContent;
        badge.className = `text-sm font-medium px-2 py-1 rounded ${up ? "bg-green-100 text-green-700" : "bg-red-100 text-red-700"}`;
      }
    }

    async function loadAllCharts() {
      try {
        const res = await fetch(`/api/stocks/modal_data?ticker=${TICKER}`);
        const swag = await res.json();
        if (swag.error) return;

        // 1. Price History
        const ctxPrice = document.getElementById("priceChart").getContext("2d");
        const isUp = swag.price_closes[swag.price_closes.length - 1] >= swag.price_closes[0];
        const priceColor = isUp ? "#10b981" : "#ef4444";
        new Chart(ctxPrice, {
          type: "line",
          data: {
            labels: swag.price_labels,
            datasets: [{
              label: `${TICKER} Price`,
              data: swag.price_closes,
              borderColor: priceColor,
              borderWidth: 2,
              pointRadius: 0,
              tension: 0.1,
              fill: false
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              x: { grid: { color: "#f3f4f6" }, ticks: { color: "#6b7280", maxTicksLimit: 10 } },
              y: { grid: { color: "#f3f4f6" }, ticks: { color: "#6b7280", callback: v => "$" + v } }
            }
          }
        });

        // 2. Growth Comparison
        const ctxGrowth = document.getElementById("growthChart").getContext("2d");
        const colors = [
          "#ef4444", "#3b82f6", "#10b981", "#f59e0b", "#8b5cf6", "#ec4899", "#06b6d4"
        ];
        const growthDatasets = swag.growth_datasets.map((dataset, idx) => {
          const isSelected = dataset.ticker === TICKER;
          return {
            label: dataset.ticker,
            data: dataset.data,
            borderColor: isSelected ? "#0284c7" : colors[idx % colors.length],
            borderWidth: isSelected ? 3 : 1.5,
            pointRadius: 0,
            tension: 0.1,
            fill: false
          };
        });
        new Chart(ctxGrowth, {
          type: "line",
          data: {
            labels: swag.monthly_labels,
            datasets: growthDatasets
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { labels: { color: "#4b5563" } } },
            scales: {
              x: { grid: { color: "#f3f4f6" }, ticks: { color: "#6b7280" } },
              y: { grid: { color: "#f3f4f6" }, ticks: { color: "#6b7280", callback: v => v + "%" } }
            }
          }
        });

        // 3. Monthly Volume
        const ctxVolume = document.getElementById("volumeChart").getContext("2d");
        new Chart(ctxVolume, {
          type: "bar",
          data: {
            labels: swag.monthly_labels,
            datasets: [{
              label: "Avg Vol",
              data: swag.monthly_volume,
              backgroundColor: "#4f46e5"
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              x: { grid: { color: "#f3f4f6" }, ticks: { color: "#6b7280" } },
              y: {
                grid: { color: "#f3f4f6" },
                ticks: {
                  color: "#6b7280",
                  callback: v => Intl.NumberFormat("en-US", { notation: "compact" }).format(v)
                }
              }
            }
          }
        });

        // 4. Sharpe Ratio Comparison
        const ctxSharpe = document.getElementById("sharpeChart").getContext("2d");
        const sharpeLabels = swag.sharpe_data.map(d => d.ticker);
        const sharpeRatios = swag.sharpe_data.map(d => d.sharpe_ratio);
        const sharpeColors = swag.sharpe_data.map(d => d.ticker === TICKER ? "#10b981" : "#9ca3af");
        new Chart(ctxSharpe, {
          type: "bar",
          data: {
            labels: sharpeLabels,
            datasets: [{
              label: "Sharpe Ratio",
              data: sharpeRatios,
              backgroundColor: sharpeColors
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              x: { grid: { color: "#f3f4f6" }, ticks: { color: "#6b7280" } },
              y: { grid: { color: "#f3f4f6" }, ticks: { color: "#6b7280" } }
            }
          }
        });

      } catch (err) {
        console.error(err);
      }
    }

    loadQuote();
    loadAllCharts();
  </script>
</body>
</html>

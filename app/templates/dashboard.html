<!DOCTYPE html>
<html lang="en">
<head>
  <title>Blossomberg: Dashboard</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
  {% include "navbar.html" %}

  <main class="max-w-6xl mx-auto px-4 py-8">
    <h1 class="text-2xl font-bold text-gray-800 mb-2">Dashboard</h1>
    <p class="text-gray-600">Welcome back, {{ user }}.</p>
    <p class="text-gray-600 mt-4">
      Explore the Navbar and check out
      <a href="{{ url_for('demo') }}" class="text-blue-600 underline">Predictions</a>
      to run the ML stock forecast demo.
    </p>

    <div class="mt-8">
      <h2 class="text-2xl font-bold text-gray-800 mb-4">My Watchlist</h2>
      <div class="mb-4">
        <input id="add-ticker" type = "text" placeholder="Enter ticker like AAPL" class="px-3 py-2 rounded text-sm">
        <button onclick="addStock()">Add Stock</button>

        <table class="mt-4 w-full bg-white text-gray-800 text-sm">
          <thead>
            <tr>
              <th>Ticker</th>
              <th>Price</th>
              <th>Remove</th>
            </tr>
          </thead>
          <tbody id = "watchlist-body">
          </tbody>
        </table>
      </div>
      <script src="/static/js/home.js"></script>
    </div>
  </main>
</body>
</html>

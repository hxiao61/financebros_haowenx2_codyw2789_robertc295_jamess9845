<!DOCTYPE html>
<html lang="en">
<head>
  <title>Login — Blossomberg</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            mono: ['"IBM Plex Mono"', 'monospace'],
            sans: ['"IBM Plex Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    body { background-color: #060d1b; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-up { animation: fadeUp 0.35s ease both; }
  </style>
</head>

<body class="min-h-screen font-sans text-slate-200 flex items-center justify-center px-4">

  <div class="fade-up w-full max-w-sm">

    <div class="mb-8 text-center">
      <p class="font-mono text-xs uppercase tracking-widest text-sky-500 mb-1">// terminal</p>
      <h1 class="font-mono text-2xl font-semibold text-slate-100 tracking-wide">Blossomberg</h1>
    </div>

    <div class="bg-slate-900 border border-slate-800 rounded-sm px-8 py-8">

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="mb-4 font-mono text-xs px-3 py-2 rounded-sm border
              {% if category == 'danger' %}border-red-800 bg-red-950/50 text-red-400
              {% elif category == 'success' %}border-emerald-800 bg-emerald-950/50 text-emerald-400
              {% else %}border-slate-700 bg-slate-800 text-slate-400{% endif %}">
              {{ message }}
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <p class="font-mono text-xs uppercase tracking-widest text-slate-500 mb-6">Sign in</p>

      <form method="POST">
        <div class="mb-4">
          <label class="font-mono text-xs uppercase tracking-widest text-slate-600 block mb-2">Username</label>
          <input type="text" name="username" required
                 class="w-full bg-slate-950 border border-slate-700 focus:border-sky-600 rounded-sm font-mono text-sm text-slate-200 px-3 py-2 outline-none transition-colors">
        </div>
        <div class="mb-6">
          <label class="font-mono text-xs uppercase tracking-widest text-slate-600 block mb-2">Password</label>
          <input type="password" name="password" required
                 class="w-full bg-slate-950 border border-slate-700 focus:border-sky-600 rounded-sm font-mono text-sm text-slate-200 px-3 py-2 outline-none transition-colors">
        </div>
        <button type="submit"
                class="w-full bg-sky-700 hover:bg-sky-600 text-white font-mono text-xs uppercase tracking-widest py-2.5 rounded-sm transition-colors">
          Login
        </button>
      </form>

      <p class="mt-5 font-mono text-xs text-slate-600 text-center">
        No account?
        <a href="{{ url_for('register') }}" class="text-sky-500 hover:text-sky-400 transition-colors">Register</a>
      </p>
    </div>
  </div>

</body>
</html>

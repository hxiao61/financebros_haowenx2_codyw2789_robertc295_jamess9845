<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prediction Demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
</head>
<body class="bg-white">
  <main class="container py-4">
    <div class="row g-3 align-items-center mb-3">
      <div class="col-12 col-md">
        <h2 class="h4 mb-0 text-dark">Prediction Demo</h2>
      </div>
      <div class="col-8 col-md-3">
        <input id="ticker" value="NVDA" maxlength="8" class="form-control" />
      </div>
      <div class="col-4 col-md-2">
        <button id="run" class="btn btn-primary w-100">Run</button>
      </div>
    </div>
    <div class="mb-3 d-flex flex-wrap gap-2">
      <button class="btn btn-outline-secondary btn-sm quick-ticker" data-ticker="AAPL">AAPL</button>
      <button class="btn btn-outline-secondary btn-sm quick-ticker" data-ticker="MSFT">MSFT</button>
      <button class="btn btn-outline-secondary btn-sm quick-ticker" data-ticker="NVDA">NVDA</button>
      <button class="btn btn-outline-secondary btn-sm quick-ticker" data-ticker="AMZN">AMZN</button>
      <button class="btn btn-outline-secondary btn-sm quick-ticker" data-ticker="META">META</button>
      <button class="btn btn-outline-secondary btn-sm quick-ticker" data-ticker="GOOGL">GOOGL</button>
      <button class="btn btn-outline-secondary btn-sm quick-ticker" data-ticker="TSLA">TSLA</button>
    </div>
    <div id="meta" class="small text-secondary mb-2"></div>
    <div id="error" class="small text-danger mb-2"></div>
    <div class="card">
      <div class="card-body">
        <canvas id="chart" style="height:360px;"></canvas>
      </div>
    </div>
  </main>
  <script src="/static/js/demo.js"></script>
</body>
</html>
